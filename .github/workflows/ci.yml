name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck & build
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    # Deliberately uses NO `uses:` marketplace actions and NO setup-node:
    # under a restrictive Actions policy ("Allow <owner> actions only"),
    # third-party actions like actions/checkout are blocked and the job fails
    # instantly with 0 compute. Manual git checkout + the runner's preinstalled
    # Node make this workflow run under any Actions permission setting.
    steps:
      - name: Checkout ${{ github.sha }}
        run: |
          git init -q .
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git -c protocol.version=2 fetch -q --depth 1 origin "${{ github.sha }}"
          git checkout -q FETCH_HEAD

      - name: Environment
        run: node -v && npm -v

      - name: Install, typecheck, build
        run: |
          npm ci
          npm run typecheck
          npm run build
